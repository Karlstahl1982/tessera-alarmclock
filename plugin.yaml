# Tessera AlarmClock 0.0.5: one local test alarm, native time input.
# Uses the existing guition_tone RTTTL instance from Hilde's audio override.
datetime:
  - platform: template
    id: alarmclock_time
    type: time
    name: "AlarmClock Wecker 1 Uhrzeit"
    icon: mdi:clock-outline
    entity_category: config
    optimistic: true
    restore_value: true
    initial_value: "07:00:00"
switch:
  - platform: template
    id: alarmclock_enabled
    name: "AlarmClock Wecker 1 aktiv"
    icon: mdi:alarm
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
button:
  - platform: template
    name: "AlarmClock Testalarm"
    icon: mdi:volume-high
    entity_category: diagnostic
    on_press:
      - lambda: 'id(alarm_clock).start_test();'
  - platform: template
    name: "AlarmClock Alarm stoppen"
    icon: mdi:alarm-off
    on_press:
      - lambda: 'id(alarm_clock).stop_alarm();'
alarmclock:
  id: alarm_clock
  alarm_time: alarmclock_time
  enabled: alarmclock_enabled
  tone: guition_tone
